<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Plan - Multi-Shift Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #0f172a;
            --secondary: #3b82f6;
            --accent: #10b981;
            --pink: #ec4899;
            --danger: #ef4444;
            --bg: #090d16;
            --card-bg: #111827;
            --border: #1f2937;
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --select-bg: #030712;
        }

        [data-theme="light"] {
            --primary: #f8fafc;
            --secondary: #2563eb;
            --accent: #059669;
            --pink: #db2777;
            --danger: #dc2626;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text: #0f172a;
            --text-muted: #64748b;
            --select-bg: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; direction: ltr; text-align: left; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
        
        #login-screen {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .login-card {
            background: var(--card-bg); border: 1px solid var(--border); padding: 40px; border-radius: 20px;
            width: 100%; max-width: 420px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3);
        }
        .login-card h1 { font-size: 26px; margin-bottom: 8px; color: var(--pink); font-weight: 900; }
        .login-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        .login-input {
            width: 100%; padding: 12px 16px; background: var(--select-bg); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text); font-size: 18px; text-align: center; letter-spacing: 4px; margin-bottom: 16px;
        }
        .btn {
            background: linear-gradient(135deg, var(--secondary), #2563eb); color: white; border: none; padding: 12px 24px; border-radius: 10px;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .btn:hover { opacity: 0.95; transform: translateY(-2px); }
        .btn-pink { background: linear-gradient(135deg, var(--pink), #db2777); box-shadow: 0 4px 12px rgba(236,72,153,0.3); }
        .btn-danger { background: var(--danger); box-shadow: 0 4px 12px rgba(239,68,68,0.3); }
        .btn-success { background: var(--accent); box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        .btn-warning { background: #f59e0b; box-shadow: 0 4px 12px rgba(245,158,11,0.3); }

        #app-container, #admin-container { display: none; flex-direction: column; min-height: 100vh; }
        header {
            background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 32px;
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-area h2 { font-size: 24px; font-weight: 900; background: linear-gradient(135deg, #3b82f6, var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .tab-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px;
            border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .tab-btn.active, .tab-btn:hover { background: var(--secondary); color: white; border-color: var(--secondary); }

        main { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; flex: 1; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 14px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .stat-card h4 { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; }
        .stat-card .val { font-size: 26px; font-weight: 900; color: var(--pink); }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .search-box {
            background: var(--card-bg); border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px;
            display: flex; align-items: center; gap: 8px; width: 320px;
        }
        .search-box input { background: transparent; border: none; color: var(--text); outline: none; width: 100%; font-size: 14px; }

        .section-title { font-size: 18px; font-weight: 800; color: var(--pink); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        
        .supports-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .support-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
        .support-box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .support-items-list { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; padding-right: 4px; }
        .support-item-row { display: flex; gap: 8px; align-items: center; }

        .table-responsive { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text); }
        th { background: var(--select-bg); color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        tr:hover { background: rgba(100,100,100,0.03); }
        
        select, input[type="text"], input[type="file"] {
            width: 100%; background: var(--select-bg); border: 1px solid var(--border); color: var(--text); padding: 10px 14px;
            border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s;
        }
        select:focus, input:focus { border-color: var(--pink); box-shadow: 0 0 0 2px rgba(236,72,153,0.2); }

        select.conflict { 
            background: rgba(239, 68, 68, 0.2) !important; 
            border: 2px solid var(--danger) !important; 
            color: var(--text) !important;
            font-weight: 700;
        }

        .history-badge { font-size: 11px; background: var(--select-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 2px 8px; border-radius: 6px; display: inline-block; margin-top: 6px; }
        .stock-badge { font-size: 12px; background: rgba(59, 130, 246, 0.15); color: var(--secondary); border: 1px solid rgba(59, 130, 246, 0.3); padding: 4px 10px; border-radius: 6px; font-weight: 700; display: inline-block; }

        .db-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
        .form-card { background: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 14px; height: fit-content; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); }

        #export-area { 
            background: #ffffff; color: #111827; padding: 32px; border-radius: 16px; font-family: 'Cairo', sans-serif;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 800px;
        }
        .export-header { text-align: center; margin-bottom: 24px; border-bottom: 3px solid #f3f4f6; padding-bottom: 16px; }
        .export-header h2 { font-size: 26px; color: #1e293b; font-weight: 900; margin-bottom: 4px; }
        .export-header p { color: #64748b; font-size: 14px; font-weight: 600; }
        
        .export-table { width: 100%; border-collapse: collapse; margin-top: 16px; text-align: left; }
        .export-table th { background: #1e293b; color: #ffffff; padding: 12px 14px; font-size: 13px; border: 1px solid #cbd5e1; }
        .export-table td { padding: 10px 14px; border: 1px solid #e2e8f0; font-size: 13px; color: #334155; font-weight: 600; }
        .export-table tr:nth-child(even) { background: #f8fafc; }
        
        .export-supports-section { margin-top: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .export-support-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px; }
        .export-support-card h4 { font-size: 14px; color: #1e293b; margin-bottom: 8px; border-bottom: 2px solid #cbd5e1; padding-bottom: 4px; font-weight: 800; }
        .export-support-card ul { padding-left: 18px; font-size: 13px; color: #475569; }

        #modal-overlay, #report-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000;
            display: none; justify-content: center; align-items: center; padding: 20px; overflow-y: auto;
        }
        .modal-content {
            background: var(--card-bg); color: var(--text); padding: 30px; border-radius: 16px; max-width: 550px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; border: 1px solid var(--border);
        }

        .checkbox-container {
            max-height: 200px; overflow-y: auto; background: var(--select-bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
        }
        .checkbox-item {
            display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; color: var(--text);
        }
        .checkbox-item input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: var(--pink); cursor: pointer;
        }

        @media(max-width: 768px) {
            .db-grid, .supports-grid, .export-supports-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
